function imageHandles(a){return [{key:'left',x:a.x,y:a.y+a.h/2},{key:'right',x:a.x+a.w,y:a.y+a.h/2},{key:'top',x:a.x+a.w/2,y:a.y},{key:'bottom',x:a.x+a.w/2,y:a.y+a.h},{key:'tl',x:a.x,y:a.y},{key:'tr',x:a.x+a.w,y:a.y},{key:'bl',x:a.x,y:a.y+a.h},{key:'br',x:a.x+a.w,y:a.y+a.h}]}
function hitResizeHandle(p){if(!selected||selected.type!=='image')return null;return imageHandles(selected).find(h=>Math.abs(h.x-p.x)<=9/zoom&&Math.abs(h.y-p.y)<=9/zoom)?.key||null}
function resizeImage(a,g,p){const start=g.start,min=12;let left=start.x,top=start.y,right=start.x+start.w,bottom=start.y+start.h;const k=g.handle;if(k.length===2){const ratio=start.w/start.h;const anchorX=k.includes('l')?right:left,anchorY=k.includes('t')?bottom:top;const signX=k.includes('l')?-1:1,signY=k.includes('t')?-1:1;const width=Math.max(min,Math.max(signX*(p.x-anchorX),signY*(p.y-anchorY)*ratio));const height=width/ratio;left=signX<0?anchorX-width:anchorX;right=signX<0?anchorX:anchorX+width;top=signY<0?anchorY-height:anchorY;bottom=signY<0?anchorY:anchorY+height}else{if(k==='left')left=Math.min(p.x,right-min);if(k==='right')right=Math.max(p.x,left+min);if(k==='top')top=Math.min(p.y,bottom-min);if(k==='bottom')bottom=Math.max(p.y,top+min)}a.x=left;a.y=top;a.w=right-left;a.h=bottom-top}
function updateDeleteObject(){const button=$('deleteObject');if(!selected||!doc||!pages.length){button.classList.add('d-none');return}const b=bounds(selected);const x=Math.max(0,Math.min(canvas.width-30,(b.x+b.w)*zoom+6));const y=Math.max(0,Math.min(canvas.height-30,b.y*zoom-30));button.style.left=x+'px';button.style.top=y+'px';button.classList.remove('d-none')}
$('deleteObject').onclick=async()=>{if(!selected||!doc)return;const index=page().items.indexOf(selected);if(index<0)return;page().items.splice(index,1);selected=null;gesture=null;drawOverlay();renderList();await saveHistory()};
function bounds(a){if(a.type==='text')return{x:a.x,y:a.y-a.size,w:a.text.length*a.size*.65,h:a.size};if(a.type==='image')return{x:a.x,y:a.y,w:a.w,h:a.h};if(a.type==='draw'){const xs=a.points.map(p=>p.x),ys=a.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}return{x:Math.min(a.x,a.x2),y:Math.min(a.y,a.y2),w:Math.abs(a.x2-a.x),h:Math.abs(a.y2-a.y)}}
function hitItem(a,p){const tolerance=7+Math.max(0,(a.size||2)/2);if(a.type==='draw'){const points=a.points||[];for(let i=1;i<points.length;i++){const v=points[i-1],w=points[i],dx=w.x-v.x,dy=w.y-v.y,length=dx*dx+dy*dy;const t=length?Math.max(0,Math.min(1,((p.x-v.x)*dx+(p.y-v.y)*dy)/length)):0;const x=v.x+t*dx,y=v.y+t*dy;if(Math.hypot(p.x-x,p.y-y)<=tolerance)return true}return points.length===1&&Math.hypot(p.x-points[0].x,p.y-points[0].y)<=tolerance}const b=bounds(a);if(a.type==='rect'){const inside=p.x>=b.x-tolerance&&p.x<=b.x+b.w+tolerance&&p.y>=b.y-tolerance&&p.y<=b.y+b.h+tolerance;return inside&&(Math.abs(p.x-b.x)<=tolerance||Math.abs(p.x-b.x-b.w)<=tolerance||Math.abs(p.y-b.y)<=tolerance||Math.abs(p.y-b.y-b.h)<=tolerance)}return p.x>=b.x-tolerance&&p.x<=b.x+b.w+tolerance&&p.y>=b.y-tolerance&&p.y<=b.y+b.h+tolerance}
function move(a,dx,dy){a.x+=dx;a.y+=dy;if(a.x2!==undefined){a.x2+=dx;a.y2+=dy}if(a.points)a.points.forEach(p=>{p.x+=dx;p.y+=dy})}
function settings(){return {color:$('color').value,size:Math.max(1,Number($('size').value)||2)}}
overlay.onpointerdown=e=>{if(!doc)return;overlay.setPointerCapture(e.pointerId);const p=pt(e);const handle=hitResizeHandle(p);if(handle){gesture={type:'resize',handle,start:{x:selected.x,y:selected.y,w:selected.w,h:selected.h},changed:false};return}const hit=[...page().items].reverse().find(a=>hitItem(a,p));if(hit){selected=hit;gesture={type:'move',last:p,moved:false};drawOverlay();return}if(!tool){selected=null;gesture=null;drawOverlay();return}const a={type:tool,x:p.x,y:p.y,...settings()};if(tool==='text'){a.text=$('text').value||t('defaultText');page().items.push(a);selected=a;drawOverlay();renderList();saveHistory();return}if(tool==='image'){if(!imageData){$('imageFile').click();return}a.img=imageData.img;a.src=imageData.src;a.w=Math.min(imageData.img.width,220);a.h=a.w*imageData.img.height/imageData.img.width;page().items.push(a);selected=a;drawOverlay();renderList();saveHistory();return}if(tool==='draw')a.points=[p];else{a.x2=p.x;a.y2=p.y}page().items.push(a);gesture={type:'create',a};selected=a;drawOverlay()};
overlay.onpointermove=e=>{if(!gesture)return;const p=pt(e);if(gesture.type==='resize'){resizeImage(selected,gesture,p);gesture.changed=true}else if(gesture.type==='move'){move(selected,p.x-gesture.last.x,p.y-gesture.last.y);gesture.moved=true;gesture.last=p}else if(gesture.a.type==='draw')gesture.a.points.push(p);else{gesture.a.x2=p.x;gesture.a.y2=p.y}drawOverlay()};overlay.onpointerup=()=>{const changed=gesture&&(gesture.type==='create'||gesture.moved||gesture.changed);gesture=null;if(doc)renderList();if(changed)saveHistory()};
$('imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});const img=new Image();img.onload=()=>{imageData={src,img};tool='image';setTool();msg(t('imageReady'))};img.src=src;e.target.value=''};
function setTool(){
 $('ribbonOptions').hidden=!['text','draw','rect','highlight'].includes(tool);
 document.querySelectorAll('[data-tool]').forEach(b=>{const on=b.dataset.tool===tool;b.classList.toggle('active',on);b.classList.toggle('btn-primary',on);b.classList.toggle('btn-outline-secondary',!on)});
 document.querySelectorAll('[data-option]').forEach(el=>{el.hidden=!el.dataset.option.split(' ').includes(tool)&&!el.dataset.option.split(' ').includes('all')});
}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=tool===b.dataset.tool?null:b.dataset.tool;setTool()});
$('zoom').onchange=async e=>{zoom=Number(e.target.value);await render()};
$('prev').onclick=async()=>{if(current>0){current--;selected=null;await render()}};$('next').onclick=async()=>{if(current<pages.length-1){current++;selected=null;await render()}};
$('reset').onclick=async()=>{if(!window.confirm(t('resetConfirm')))return;doc=null;pages=[];current=0;selected=null;imageData=null;gesture=null;zoom=1;$('zoom').value='1';tool='select';setTool();await render();await saveHistory()};
$('deletePage').onclick=async()=>{if(!doc||!pages.length)return;if(!window.confirm(t('deletePageConfirm',{page:current+1})))return;doc.removePage(current);pages.splice(current,1);current=Math.max(0,Math.min(current,pages.length-1));selected=null;gesture=null;if(!pages.length)doc=null;await render();await saveHistory()};
$('addPage').onclick=async()=>{if(!doc)doc=await PDFDocument.create();const p=doc.addPage([595,842]);pages.push({p,items:[]});current=pages.length-1;await render();await saveHistory()};
async function rotatePage(delta){if(!doc)return;const p=page().p;p.setRotation(degrees(((p.getRotation().angle+delta)%360+360)%360));selected=null;await render();await saveHistory()}
$('rotateLeft').onclick=()=>rotatePage(-90);$('rotateRight').onclick=()=>rotatePage(90);
async function reorder(direction){const target=current+direction;if(target<0||target>=pages.length)return;[pages[current],pages[target]]=[pages[target],pages[current]];current=target;await rebuild();await render();await saveHistory()}
async function rebuild(){const old=doc;const nd=await PDFDocument.create();const copied=await nd.copyPages(old,pages.map(q=>old.getPages().indexOf(q.p)));copied.forEach((p,i)=>{nd.addPage(p);pages[i].p=p});doc=nd}
$('up').onclick=()=>reorder(-1);$('down').onclick=()=>reorder(1);
function download(bytes,name){const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function exportDoc(onlyCurrent=false){if(!doc||busy)return;busy=true;try{const out=await PDFDocument.create();const indexes=onlyCurrent?[current]:pages.map((_,i)=>i);const copied=await out.copyPages(doc,indexes);for(let k=0;k<indexes.length;k++){const original=pages[indexes[k]],p=copied[k];out.addPage(p);const {height}=p.getSize();for(const item of original.items){const a=item;const color=hexRgb(a.color||'#e83d5a');const rgb=(await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm')).rgb;const c=rgb(...color);if(a.type==='text'){const font=await out.embedFont('Helvetica');const safe=[...a.text].map(ch=>ch.charCodeAt(0)>255?'?':ch).join('');p.drawText(safe,{x:a.x,y:height-a.y,size:a.size,font,color:c})}else if(a.type==='rect'||a.type==='whiteout'||a.type==='highlight'){const x=Math.min(a.x,a.x2),y=Math.min(a.y,a.y2),w=Math.abs(a.x2-a.x),h=Math.abs(a.y2-a.y);if(a.type==='rect')p.drawRectangle({x,y:height-y-h,width:w,height:h,borderWidth:Math.max(1,a.size/4),borderColor:c,opacity:1});else p.drawRectangle({x,y:height-y-h,width:w,height:h,color:a.type==='whiteout'?rgb(1,1,1):c,opacity:a.type==='highlight'?.3:1})}else if(a.type==='draw'){for(let i=1;i<a.points.length;i++)p.drawLine({start:{x:a.points[i-1].x,y:height-a.points[i-1].y},end:{x:a.points[i].x,y:height-a.points[i].y},color:c,thickness:Math.max(1,a.size/5)})}else if(a.type==='image'){const b=Uint8Array.from(atob(a.src.split(',')[1]),ch=>ch.charCodeAt(0));const img=a.src.startsWith('data:image/png')?await out.embedPng(b):await out.embedJpg(b);p.drawImage(img,{x:a.x,y:height-a.y-a.h,width:a.w,height:a.h})}}}download(await out.save(),t(onlyCurrent?'downloadPage':'downloadAll'));msg(t('exported'))}catch(e){console.error(e);msg(t('exportError',{error:e.message}))}finally{busy=false}}
$('save').onclick=()=>exportDoc(false);
setTool();
$('ribbonOptions').hidden=true;
initLanguages();
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&document.activeElement.tagName!=='INPUT'){(e.shiftKey?$('redo'):$('undo')).click();e.preventDefault()}});
</script></body></html>
