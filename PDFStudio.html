<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Studio</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="bg-body-tertiary"><div class="d-flex flex-column vh-100 overflow-hidden"><header class="navbar navbar-dark bg-dark px-3 py-2"><div class="navbar-brand fw-bold mb-0">PDF <span>Studio</span></div><label class="d-flex align-items-center gap-2 text-white small ms-auto" for="language"><span data-i18n="language">Ngôn ngữ</span><select id="language" class="form-select form-select-sm w-auto"></select></label><input class="d-none" type="file" id="file" accept="application/pdf" multiple><input class="d-none" type="file" id="imageFile" accept="image/png,image/jpeg"></header><div class="row g-0 flex-grow-1 overflow-hidden"><aside id="leftPanel" class="col-3 col-lg-2 bg-white border-end d-flex flex-column overflow-hidden">
<section class="flex-shrink-0 p-3 border-bottom"><h5 class="mb-3">File</h5><div class="d-flex flex-column gap-2"><button class="btn btn-outline-secondary btn-sm" id="newFile" type="button" data-i18n="newFile">New Project</button><button class="btn btn-outline-secondary btn-sm" id="addPage" data-i18n="addPage">＋ Trang trắng</button><button class="btn btn-outline-secondary btn-sm" id="merge" data-i18n="merge">＋ Add PDF</button><button class="btn btn-outline-secondary btn-sm" id="save" data-i18n="save">⬇ Xuất PDF</button></div></section>
<section class="flex-grow-1 d-flex flex-column overflow-hidden"><div class="flex-shrink-0 p-3 border-bottom"><h5 class="mb-3" data-i18n="pageList">Danh sách trang</h5><div class="d-flex flex-column gap-2"><div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm flex-fill" id="up" data-i18n="up">↑ Chuyển lên</button><button class="btn btn-outline-secondary btn-sm flex-fill" id="down" data-i18n="down">↓ Chuyển xuống</button></div><div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm flex-fill" id="rotateLeft" data-i18n="rotateLeft">↶ Xoay trái 90°</button><button class="btn btn-outline-secondary btn-sm flex-fill" id="rotateRight" data-i18n="rotateRight">↷ Xoay phải 90°</button></div><div id="documentPageActions" hidden><div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm flex-fill" id="prev" data-i18n="prev">← Trước</button><button class="btn btn-outline-secondary btn-sm flex-fill" id="next" data-i18n="next">Sau →</button></div></div></div></div><div class="flex-grow-1 position-relative overflow-hidden"><div id="pages" class="position-absolute top-0 bottom-0 start-0 end-0 overflow-auto p-3" tabindex="0" aria-label="Danh sách trang PDF"></div></div></section>
</aside><main class="col d-flex flex-column bg-body-secondary overflow-hidden"><div class="bg-white border-bottom px-3 py-2"><div class="d-flex flex-wrap gap-2 align-items-center"></div></div><div id="ribbon" class="bg-white border-bottom" hidden><div id="panelContent" class="d-flex flex-wrap align-items-center gap-2 px-3 py-2" role="toolbar" aria-label="Xử lý văn bản">
<span class="fw-semibold small text-secondary me-2" data-i18n="tabContent">Xử lý văn bản</span>
<button data-tool="select" data-i18n="select" class="btn btn-primary btn-sm active">↖ Chọn</button><button class="btn btn-outline-secondary btn-sm" data-tool="text" data-i18n="textTool">T Văn bản</button><button class="btn btn-outline-secondary btn-sm" data-tool="draw" data-i18n="draw">✎ Vẽ</button><button class="btn btn-outline-secondary btn-sm" data-tool="rect" data-i18n="rect">▭ Khung</button><button class="btn btn-outline-secondary btn-sm" data-tool="highlight" data-i18n="highlight">▨ Tô sáng</button><button class="btn btn-outline-secondary btn-sm" data-tool="whiteout" data-i18n="whiteout">▣ Che phủ</button><button class="btn btn-outline-secondary btn-sm" data-tool="image" data-i18n="image">▧ Hình ảnh</button>
<div class="d-flex flex-wrap align-items-center gap-2 ms-auto"><label class="d-flex align-items-center gap-2 small" data-option="all"><span data-i18n="zoomLabel">Phóng to</span><select class="form-select form-select-sm w-auto" id="zoom"><option value="0.6">60%</option><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button class="btn btn-outline-secondary btn-sm" id="undo" data-i18n="undo">↶ Hoàn tác nét cuối</button></div>
</div>
<div id="ribbonOptions" class="border-top px-3 py-2" hidden><div id="toolOptions" class="d-flex flex-wrap align-items-center gap-3">
<label class="d-flex align-items-center gap-2 small" data-option="text"><span data-i18n="textLabel">Nội dung văn bản</span><input class="form-control form-control-sm w-auto" id="text" value="Nội dung mới"></label>
<label class="d-flex align-items-center gap-2 small" data-option="text draw rect highlight"><span data-i18n="sizeLabel">Cỡ chữ / độ dày nét</span><input class="form-control form-control-sm w-auto" id="size" type="number" min="1" max="150" value="20"></label>
<label class="d-flex align-items-center gap-2 small" data-option="text draw rect highlight"><span data-i18n="colorLabel">Màu</span><input class="form-control form-control-sm w-auto" id="color" type="color" value="#e83d5a"></label>

</div></div>
</div><div class="flex-grow-1 overflow-auto p-3"><div id="empty" class="text-center text-secondary py-5" data-i18n="empty">Mở một tệp PDF để bắt đầu chỉnh sửa.</div><div id="paper" class="position-relative mx-auto bg-white shadow" hidden><canvas class="d-block" id="canvas"></canvas><canvas id="overlay" class="position-absolute top-0 start-0"></canvas></div></div><div id="viewerFooter" class="bg-white border-top px-3 py-2 d-flex flex-wrap align-items-center gap-3" hidden><div class="small text-secondary ms-auto" id="status"></div></div></main></div><div id="toast" class="position-fixed bottom-0 end-0 m-3 bg-primary text-white p-3 rounded shadow"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
import {PDFDocument,degrees} from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

// Translation files are loaded dynamically from locales/config.json.
let translations={},languageConfig=null,currentLanguage='vi';
function t(key,vars={}){let value=translations[key]??key;return value.replace(/\{(\w+)\}/g,(_,name)=>String(vars[name]??''))}
function applyLanguage(){document.documentElement.lang=currentLanguage;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});if(!doc)$('empty').textContent=t('empty');else{renderList();updateStatus()}}
function updateStatus(){if(!doc||!pages.length)return;const {width,height}=dims();$('status').textContent=t('pageStatus',{current:current+1,total:pages.length,width:Math.round(width),height:Math.round(height)})}
async function changeLanguage(code){const entry=languageConfig.languages.find(l=>l.code===code);if(!entry)return;try{const response=await fetch(entry.file);if(!response.ok)throw Error(response.status);translations=await response.json();currentLanguage=code;$('language').value=code;applyLanguage()}catch(err){console.error(err);msg('Unable to load language: '+code)}}
function detectBrowserLanguage(supported){
 const preferences=navigator.languages?.length?navigator.languages:[navigator.language||'en'];
 for(const locale of preferences){
  const normalized=locale.toLowerCase();
  const exact=supported.find(code=>code.toLowerCase()===normalized);
  if(exact)return exact;
  const base=normalized.split('-')[0];
  const match=supported.find(code=>code.toLowerCase().split('-')[0]===base);
  if(match)return match;
 }
 return supported.includes('en')?'en':supported[0];
}
async function initLanguages(){try{const r=await fetch('locales/config.json');if(!r.ok)throw Error(r.status);languageConfig=await r.json();$('language').replaceChildren(...languageConfig.languages.map(l=>{const o=document.createElement('option');o.value=l.code;o.textContent=l.name;return o}));$('language').onchange=e=>changeLanguage(e.target.value);const supported=languageConfig.languages.map(l=>l.code);await changeLanguage(detectBrowserLanguage(supported))}catch(e){console.error(e);msg('Language configuration requires a local web server (Live Server).')}}
const $=id=>document.getElementById(id), file=$('file'), paper=$('paper'),canvas=$('canvas'),overlay=$('overlay'),ctx=overlay.getContext('2d');
let doc=null, pages=[],current=0,tool='select',zoom=1,gesture=null,selected=null,imageData=null, busy=false;
function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function hexRgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255)}
function page(){return pages[current]}
async function openPdf(bytes,append=false){try{const incoming=await PDFDocument.load(bytes,{ignoreEncryption:false});if(!append||!doc){doc=await PDFDocument.create();pages=[];current=0}const copied=await doc.copyPages(incoming,incoming.getPageIndices());for(const p of copied){doc.addPage(p);pages.push({p,items:[]})}current=append?pages.length-copied.length:0;await render();msg(t(append?'merged':'opened',{count:copied.length}))}catch(e){console.error(e);msg(t('openError'))}}
$('merge').onclick=()=>{file.dataset.mode='merge';file.click()};file.onchange=async()=>{const files=[...file.files];for(let i=0;i<files.length;i++)await openPdf(await files[i].arrayBuffer(),file.dataset.mode==='merge'||i>0);file.value=''};
function dims(){const p=page().p;const {width,height}=p.getSize();return {width,height}}
async function render(){if(!doc||!pages.length){paper.hidden=true;$('ribbon').hidden=true;$('viewerFooter').hidden=true;$('documentPageActions').hidden=true;$('empty').hidden=false;$('status').textContent='';$('pages').innerHTML='';return}paper.hidden=false;$('ribbon').hidden=false;$('viewerFooter').hidden=false;$('documentPageActions').hidden=false;$('empty').hidden=true;const {width,height}=dims(),scale=zoom;const data=await doc.save();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(data)}).promise;const viewport=(await pdf.getPage(current+1)).getViewport({scale});canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);overlay.width=canvas.width;overlay.height=canvas.height;paper.style.width=canvas.width+'px';paper.style.height=canvas.height+'px';await (await pdf.getPage(current+1)).render({canvasContext:canvas.getContext('2d'),viewport}).promise;drawOverlay();$('status').textContent=`Trang ${current+1}/${pages.length} · ${Math.round(width)} × ${Math.round(height)} pt`;renderList();updateStatus()}
let draggedIndex=null;
function renderList(){
 const list=$('pages');list.innerHTML='';
 pages.forEach((p,i)=>{
  const b=document.createElement('button');b.type='button';b.draggable=true;
  b.className='btn btn-sm w-100 text-start mb-2 '+(i===current?'btn-primary':'btn-outline-secondary');
  b.textContent=`☰ ${t('page')} ${i+1} (${p.items.length} ${t('layers')})`;
  b.onclick=async()=>{current=i;selected=null;await render()};
  b.ondragstart=e=>{draggedIndex=i;b.classList.add('opacity-50');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))};
  b.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';b.classList.remove('border-primary','border-3');b.classList.add(e.clientY<b.getBoundingClientRect().top+b.offsetHeight/2?'border-primary':'border-3')};
  b.ondragleave=()=>b.classList.remove('border-primary','border-3');
  b.ondrop=async e=>{e.preventDefault();e.stopPropagation();const from=draggedIndex;b.classList.remove('border-primary','border-3');if(from===null)return;let target=i+(e.clientY>=b.getBoundingClientRect().top+b.offsetHeight/2?1:0);if(from<target)target--;draggedIndex=null;if(from===target)return;const moved=pages.splice(from,1)[0];pages.splice(target,0,moved);current=target;selected=null;await rebuild();await render();msg(t('reordered'))};
  b.ondragend=()=>{draggedIndex=null;list.querySelectorAll('button').forEach(x=>x.classList.remove('opacity-50','border-primary','border-3'))};
  list.append(b)
 })
}
function pt(e){const r=overlay.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}
function drawOverlay(){ctx.clearRect(0,0,overlay.width,overlay.height);ctx.save();ctx.scale(zoom,zoom);for(const item of page().items){ctx.save();ctx.lineWidth=item.size||2;ctx.strokeStyle=item.color||'#e83d5a';ctx.fillStyle=item.color||'#e83d5a';if(item.type==='text'){ctx.font=`${item.size}px Arial`;ctx.fillText(item.text,item.x,item.y)}if(item.type==='rect'||item.type==='highlight'||item.type==='whiteout'){const x=Math.min(item.x,item.x2),y=Math.min(item.y,item.y2),w=Math.abs(item.x2-item.x),h=Math.abs(item.y2-item.y);if(item.type==='highlight'){ctx.globalAlpha=.3;ctx.fillRect(x,y,w,h)}else if(item.type==='whiteout'){ctx.fillStyle='white';ctx.fillRect(x,y,w,h)}else ctx.strokeRect(x,y,w,h)}if(item.type==='draw'){ctx.beginPath();item.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}if(item.type==='image'&&item.img)ctx.drawImage(item.img,item.x,item.y,item.w,item.h);if(item===selected){ctx.setLineDash([4,4]);ctx.strokeStyle='#2586ff';ctx.lineWidth=1;const b=bounds(item);ctx.strokeRect(b.x-3,b.y-3,b.w+6,b.h+6)}ctx.restore()}ctx.restore()}
function bounds(a){if(a.type==='text')return{x:a.x,y:a.y-a.size,w:a.text.length*a.size*.65,h:a.size};if(a.type==='image')return{x:a.x,y:a.y,w:a.w,h:a.h};if(a.type==='draw'){const xs=a.points.map(p=>p.x),ys=a.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}return{x:Math.min(a.x,a.x2),y:Math.min(a.y,a.y2),w:Math.abs(a.x2-a.x),h:Math.abs(a.y2-a.y)}}
function move(a,dx,dy){a.x+=dx;a.y+=dy;if(a.x2!==undefined){a.x2+=dx;a.y2+=dy}if(a.points)a.points.forEach(p=>{p.x+=dx;p.y+=dy})}
function settings(){return {color:$('color').value,size:Math.max(1,Number($('size').value)||2)}}
overlay.onpointerdown=e=>{if(!doc)return;overlay.setPointerCapture(e.pointerId);const p=pt(e);if(tool==='select'){selected=[...page().items].reverse().find(a=>{const b=bounds(a);return p.x>=b.x-6&&p.x<=b.x+b.w+6&&p.y>=b.y-6&&p.y<=b.y+b.h+6})||null;gesture=selected?{type:'move',last:p}:null;drawOverlay();return}const a={type:tool,x:p.x,y:p.y,...settings()};if(tool==='text'){a.text=$('text').value||t('defaultText');page().items.push(a);selected=a;drawOverlay();renderList();return}if(tool==='image'){if(!imageData){$('imageFile').click();return}a.img=imageData.img;a.src=imageData.src;a.w=Math.min(imageData.img.width,220);a.h=a.w*imageData.img.height/imageData.img.width;page().items.push(a);selected=a;drawOverlay();renderList();return}if(tool==='draw')a.points=[p];else{a.x2=p.x;a.y2=p.y}page().items.push(a);gesture={type:'create',a};selected=a;drawOverlay()};
overlay.onpointermove=e=>{if(!gesture)return;const p=pt(e);if(gesture.type==='move'){move(selected,p.x-gesture.last.x,p.y-gesture.last.y);gesture.last=p}else if(gesture.a.type==='draw')gesture.a.points.push(p);else{gesture.a.x2=p.x;gesture.a.y2=p.y}drawOverlay()};overlay.onpointerup=()=>{gesture=null;if(doc)renderList()};
$('imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});const img=new Image();img.onload=()=>{imageData={src,img};tool='image';setTool();msg(t('imageReady'))};img.src=src;e.target.value=''};
function setTool(){
 $('ribbonOptions').hidden=!['text','draw','rect','highlight'].includes(tool);
 document.querySelectorAll('[data-tool]').forEach(b=>{const on=b.dataset.tool===tool;b.classList.toggle('active',on);b.classList.toggle('btn-primary',on);b.classList.toggle('btn-outline-secondary',!on)});
 document.querySelectorAll('[data-option]').forEach(el=>{el.hidden=!el.dataset.option.split(' ').includes(tool)&&!el.dataset.option.split(' ').includes('all')});
}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;setTool()});
$('zoom').onchange=async e=>{zoom=Number(e.target.value);await render()};
$('prev').onclick=async()=>{if(current>0){current--;selected=null;await render()}};$('next').onclick=async()=>{if(current<pages.length-1){current++;selected=null;await render()}};
$('newFile').onclick=async()=>{doc=null;pages=[];current=0;selected=null;tool='select';setTool();await render()};
$('addPage').onclick=async()=>{if(!doc)doc=await PDFDocument.create();const p=doc.addPage([595,842]);pages.push({p,items:[]});current=pages.length-1;await render()};$('deletePage').onclick=async()=>{if(!doc)return;doc.removePage(current);pages.splice(current,1);current=Math.max(0,Math.min(current,pages.length-1));if(!pages.length)doc=null;await render()};
async function rotatePage(delta){if(!doc)return;const p=page().p;p.setRotation(degrees(((p.getRotation().angle+delta)%360+360)%360));selected=null;await render()}
$('rotateLeft').onclick=()=>rotatePage(-90);$('rotateRight').onclick=()=>rotatePage(90);
async function reorder(direction){const target=current+direction;if(target<0||target>=pages.length)return;[pages[current],pages[target]]=[pages[target],pages[current]];current=target;await rebuild();await render()}
async function rebuild(){const old=doc;const nd=await PDFDocument.create();const copied=await nd.copyPages(old,pages.map(q=>old.getPages().indexOf(q.p)));copied.forEach((p,i)=>{nd.addPage(p);pages[i].p=p});doc=nd}
$('up').onclick=()=>reorder(-1);$('down').onclick=()=>reorder(1);$('undo').onclick=()=>{if(!doc)return;page().items.pop();selected=null;drawOverlay();renderList()};
function download(bytes,name){const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function exportDoc(onlyCurrent=false){if(!doc||busy)return;busy=true;try{const out=await PDFDocument.create();const indexes=onlyCurrent?[current]:pages.map((_,i)=>i);const copied=await out.copyPages(doc,indexes);for(let k=0;k<indexes.length;k++){const original=pages[indexes[k]],p=copied[k];out.addPage(p);const {height}=p.getSize();for(const item of original.items){const a=item;const color=hexRgb(a.color||'#e83d5a');const rgb=(await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm')).rgb;const c=rgb(...color);if(a.type==='text'){const font=await out.embedFont('Helvetica');const safe=[...a.text].map(ch=>ch.charCodeAt(0)>255?'?':ch).join('');p.drawText(safe,{x:a.x,y:height-a.y,size:a.size,font,color:c})}else if(a.type==='rect'||a.type==='whiteout'||a.type==='highlight'){const x=Math.min(a.x,a.x2),y=Math.min(a.y,a.y2),w=Math.abs(a.x2-a.x),h=Math.abs(a.y2-a.y);if(a.type==='rect')p.drawRectangle({x,y:height-y-h,width:w,height:h,borderWidth:Math.max(1,a.size/4),borderColor:c,opacity:1});else p.drawRectangle({x,y:height-y-h,width:w,height:h,color:a.type==='whiteout'?rgb(1,1,1):c,opacity:a.type==='highlight'?.3:1})}else if(a.type==='draw'){for(let i=1;i<a.points.length;i++)p.drawLine({start:{x:a.points[i-1].x,y:height-a.points[i-1].y},end:{x:a.points[i].x,y:height-a.points[i].y},color:c,thickness:Math.max(1,a.size/5)})}else if(a.type==='image'){const b=Uint8Array.from(atob(a.src.split(',')[1]),ch=>ch.charCodeAt(0));const img=a.src.startsWith('data:image/png')?await out.embedPng(b):await out.embedJpg(b);p.drawImage(img,{x:a.x,y:height-a.y-a.h,width:a.w,height:a.h})}}}download(await out.save(),t(onlyCurrent?'downloadPage':'downloadAll'));msg(t('exported'))}catch(e){console.error(e);msg(t('exportError',{error:e.message}))}finally{busy=false}}
$('save').onclick=()=>exportDoc(false);
setTool();
$('ribbonOptions').hidden=true;
initLanguages();
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&document.activeElement.tagName!=='INPUT'){$('undo').click();e.preventDefault()}});
</script></body></html>
